name: iOS CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-latest
    timeout-minutes: ${{ github.event_name == 'pull_request' && 30 || 60 }}
    env:
      TEST_PLAN: ${{ github.event_name == 'pull_request' && 'FinanceTracker-PR' || 'FinanceTracker' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select iPhone simulator
        run: |
          set -euo pipefail
          simulator_id="$(
            xcrun simctl list devices available --json | ruby -rjson -e '
              devices = JSON.parse(STDIN.read).fetch("devices").values.flatten
              simulator = devices.find do |device|
                device.fetch("isAvailable", true) && device.fetch("name", "").start_with?("iPhone")
              end
              abort "No available iPhone simulator found" unless simulator
              puts simulator.fetch("udid")
            '
          )"
          echo "simulator_id=$simulator_id" >> "$GITHUB_ENV"
          echo "Using simulator: $simulator_id"

      - name: Build for testing
        run: |
          set -euo pipefail
          xcodebuild build-for-testing \
            -project FinanceTracker.xcodeproj \
            -scheme FinanceTracker \
            -testPlan "$TEST_PLAN" \
            -destination "platform=iOS Simulator,id=$simulator_id"

      - name: Run unit tests
        run: |
          set -euo pipefail
          xcodebuild test-without-building \
            -project FinanceTracker.xcodeproj \
            -scheme FinanceTracker \
            -testPlan "$TEST_PLAN" \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            -resultBundlePath "$RUNNER_TEMP/TestResults.xcresult" \
            -parallel-testing-enabled NO

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ env.TEST_PLAN }}
          path: ${{ runner.temp }}/TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 14
